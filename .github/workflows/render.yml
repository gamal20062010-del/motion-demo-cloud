name: Arabic Kinetic Typography Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [integrate/arabic-kinetic-video-v2]
    paths:
      - 'packages/archive-parts/**'
      - 'packages/overrides/**'
      - '.github/workflows/render.yml'

permissions:
  contents: read

concurrency:
  group: arabic-kinetic-video-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble and extract project package
        shell: bash
        run: |
          set -euo pipefail
          test -d packages/archive-parts
          cat packages/archive-parts/part-*.b64 | base64 --decode > packages/Arabic-Kinetic-Video-v2.tar.xz
          tar -xJf packages/Arabic-Kinetic-Video-v2.tar.xz -C .
          test -f Arabic-Kinetic-Video-v2/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python image and FFmpeg dependencies
        run: python -m pip install --upgrade pip Pillow imageio-ffmpeg

      - name: Add portable FFmpeg binary to PATH
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_BIN="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -sf "$FFMPEG_BIN" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          "$FFMPEG_BIN" -version | head -n 2

      - name: Download Noto Arabic variable fonts from Google Fonts
        working-directory: Arabic-Kinetic-Video-v2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/fonts/NotoSansArabic public/fonts/NotoNaskhArabic
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf' \
            --output 'public/fonts/NotoSansArabic/NotoSansArabic[wdth,wght].ttf'
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf' \
            --output 'public/fonts/NotoNaskhArabic/NotoNaskhArabic[wght].ttf'
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/OFL.txt' \
            --output public/fonts/NotoSansArabic/OFL.txt
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notonaskharabic/OFL.txt' \
            --output public/fonts/NotoNaskhArabic/OFL.txt
          test -s 'public/fonts/NotoSansArabic/NotoSansArabic[wdth,wght].ttf'
          test -s 'public/fonts/NotoNaskhArabic/NotoNaskhArabic[wght].ttf'

      - name: Apply Webpack-compatible local font URLs
        run: cp packages/overrides/global.css Arabic-Kinetic-Video-v2/src/styles/global.css

      - name: Install Node dependencies
        working-directory: Arabic-Kinetic-Video-v2
        run: npm install

      - name: TypeScript type-check
        working-directory: Arabic-Kinetic-Video-v2
        run: npx tsc --noEmit

      - name: Generate smoke-test images, narration, SFX and Arabic timeline text
        working-directory: Arabic-Kinetic-Video-v2
        run: python scripts/generate_test_assets.py --force

      - name: Validate timeline structure and transcript
        working-directory: Arabic-Kinetic-Video-v2
        run: npm run check-timeline

      - name: Mix narration and sound effects
        working-directory: Arabic-Kinetic-Video-v2
        run: npm run mix-audio

      - name: Render MP4 with Remotion
        working-directory: Arabic-Kinetic-Video-v2
        run: npm run render

      - name: Validate MP4 with FFprobe and volumedetect
        working-directory: Arabic-Kinetic-Video-v2
        run: npm run validate

      - name: Upload rendered video and reports
        uses: actions/upload-artifact@v4
        with:
          name: arabic-kinetic-video-smoke-${{ github.run_number }}
          path: |
            Arabic-Kinetic-Video-v2/out/final-video.mp4
            Arabic-Kinetic-Video-v2/out/render-validation.json
            Arabic-Kinetic-Video-v2/out/audio-mix-report.json
          if-no-files-found: error
          retention-days: 14
