name: Fetch Sheikh Abdulrazzaq - Dua Al-Istiftah Audio

on:
  workflow_dispatch:
    inputs:
      rights_confirmed:
        description: "I confirm that I am authorized to download, process, and use the source audio and transcript."
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Confirm authorization for the source audio and transcript
        shell: bash
        env:
          RIGHTS_CONFIRMED: ${{ inputs.rights_confirmed }}
        run: |
          set -euo pipefail
          if [[ "$RIGHTS_CONFIRMED" != "true" ]]; then
            echo "::error::Confirm your authorization to use the source audio and transcript before downloading."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install audio downloader
        run: |
          python -m pip install --upgrade "yt-dlp[default]"
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Download dedicated episode (060)
        continue-on-error: true
        run: |
          mkdir -p out
          yt-dlp --no-playlist --remote-components ejs:github \
            -f "bestaudio/best" -x --audio-format mp3 --audio-quality 0 \
            -o "out/istiftah-060.%(ext)s" \
            "https://www.youtube.com/watch?v=wBp4vAKMeyA"

      - name: Fallback to IslamHouse audio if YouTube download is unavailable
        if: ${{ !hashFiles('out/istiftah-060.mp3') }}
        run: |
          curl --fail --location --retry 3 \
            -o out/istiftah-islamhouse.mp3 \
            "https://d1.islamhouse.com/data/ar/ih_sounds/chain_02/shar7-azkar-tahara-salah-al-badr/ar-03-shar7-azkar-tahara-salah.mp3"
          test -s out/istiftah-islamhouse.mp3

      - name: Fetch time-coded transcription
        continue-on-error: true
        run: |
          curl --fail --location --retry 2 \
            -o out/istiftah-060.srt \
            "https://baheth.ieasybooks.com/ar/media/060-%D8%AD%D8%A7%D8%AF%D9%8A%D8%AB-%D8%A7%D9%84-%D8%B0%D9%83%D8%A7%D8%B1-%D9%88%D8%A7%D9%84-%D8%AF%D8%B9%D9%8A%D8%A9%D8%A3%D8%AF%D8%B9%D9%8A%D8%A9%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%AA%D8%A7%D8%AD%D8%A7%D9%84%D8%B4%D9%8A%D8%AE-%D8%B9%D8%A8%D8%AF-%D8%A7%D9%84%D8%B1%D8%B2%D8%A7%D9%82-%D8%A7%D9%84%D8%A8%D8%AF%D8%B1/download_transcription_in_srt"
          test -s out/istiftah-060.srt

      - name: Prepare a review excerpt
        run: |
          mkdir -p out/transcript
          SOURCE_AUDIO="$(find out -maxdepth 1 -name '*.mp3' -print -quit)"
          test -n "$SOURCE_AUDIO"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$SOURCE_AUDIO" > out/source_duration.txt
          ffmpeg -y -i "$SOURCE_AUDIO" -t 00:15:00 -ac 1 -ar 16000 -c:a pcm_s16le out/transcript/review_15min.wav

      - name: Install Arabic speech transcription engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'av<19' faster-whisper==1.2.1

      - name: Transcribe the source audio excerpt in Arabic
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          import json

          audio = "out/transcript/review_15min.wav"
          model = WhisperModel("small", device="cpu", compute_type="int8")
          segments, info = model.transcribe(
              audio,
              language="ar",
              beam_size=5,
              vad_filter=True,
              word_timestamps=True,
              condition_on_previous_text=True,
          )

          rows = []
          srt = []
          txt = []
          def stamp(seconds):
              ms = int(round(seconds * 1000))
              h, ms = divmod(ms, 3600000)
              m, ms = divmod(ms, 60000)
              sec, ms = divmod(ms, 1000)
              return f"{h:02}:{m:02}:{sec:02},{ms:03}"

          for i, segment in enumerate(segments, 1):
              text = segment.text.strip()
              if not text:
                  continue
              rows.append({
                  "start": round(segment.start, 3),
                  "end": round(segment.end, 3),
                  "text": text,
                  "words": [
                      {"start": round(w.start, 3), "end": round(w.end, 3), "word": w.word}
                      for w in (segment.words or [])
                  ],
              })
              srt.append(f"{i}\n{stamp(segment.start)} --> {stamp(segment.end)}\n{text}\n")
              txt.append(f"[{stamp(segment.start)}] {text}")

          Path("out/transcript/transcript.json").write_text(
              json.dumps({"language": info.language, "language_probability": info.language_probability, "segments": rows},
                         ensure_ascii=False, indent=2), encoding="utf-8")
          Path("out/transcript/transcript.srt").write_text("\n".join(srt), encoding="utf-8")
          Path("out/transcript/transcript.txt").write_text("\n".join(txt), encoding="utf-8")
          print(f"Transcribed {len(rows)} Arabic segments; language={info.language}, probability={info.language_probability:.3f}")
          PY

      - name: Upload source audio and Arabic transcript
        uses: actions/upload-artifact@v4
        with:
          name: istiftah-source-audio
          path: |
            out/*.mp3
            out/*.srt
            out/source_duration.txt
            out/transcript/transcript.json
            out/transcript/transcript.srt
            out/transcript/transcript.txt
          if-no-files-found: error
          retention-days: 7
