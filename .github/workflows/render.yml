name: Render Arabic Abaya Kinetic Typography (Direct Source)

on:
  workflow_dispatch:
  push:
    branches: [integrate/arabic-kinetic-video-v2]
    paths:
      - 'Arabic-Kinetic-Video-v2/**'
      - '.github/workflows/render.yml'
  pull_request:
    branches: [integrate/arabic-kinetic-video-v2]
    paths:
      - 'Arabic-Kinetic-Video-v2/**'
      - '.github/workflows/render.yml'

permissions:
  contents: read

concurrency:
  group: arabic-production-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Arabic-Kinetic-Video-v2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Arabic-Kinetic-Video-v2/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Arabic-Kinetic-Video-v2/requirements.txt

      - name: Install Python narration and image dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Add portable FFmpeg binary to PATH
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_BIN="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -sf "$FFMPEG_BIN" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          "$FFMPEG_BIN" -version | head -n 2

      - name: Install exact Node dependencies from lockfile
        run: npm ci

      - name: Add standalone FFprobe to PATH
        shell: bash
        run: |
          set -euo pipefail
          FFPROBE_BIN="$(node -p "require('ffprobe-static').path")"
          test -x "$FFPROBE_BIN"
          ln -sf "$FFPROBE_BIN" "$RUNNER_TEMP/ffmpeg-bin/ffprobe"
          "$FFPROBE_BIN" -version | head -n 2

      - name: Verify checked-in master image and Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          test -s public/images/abaya-master.webp
          test -s 'public/fonts/NotoSansArabic/NotoSansArabic[wdth,wght].ttf'
          test -s 'public/fonts/NotoNaskhArabic/NotoNaskhArabic[wght].ttf'
          test -s public/fonts/NotoSansArabic/OFL.txt
          test -s public/fonts/NotoNaskhArabic/OFL.txt

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Generate four aligned transparent abaya PNG states
        run: python scripts/create_abaya_variants.py

      - name: Apply the approved scene-four garment position
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("src/data/timeline.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          scene = next(item for item in data["scenes"] if item["id"] == "scene-04-qualities")
          scene["mainElement"]["position"] = {"from": {"x": 540, "y": 1370}, "to": {"x": 540, "y": 1635}}
          scene["mainElement"]["scale"] = {"from": 0.58, "to": 0.42, "interpolation": "smooth-ease"}
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8")
          PY

      - name: Generate Edge TTS narration and exact word-boundary timing
        run: python scripts/generate_narration.py --voice ar-SA-HamedNeural --rate=-6%

      - name: Generate Pop and Whoosh effects
        run: python scripts/generate_sfx.py

      - name: Validate timeline and required assets
        run: npm run check-timeline

      - name: Mix effects at 20 percent of narration loudness
        run: npm run mix-audio

      - name: Render final MP4 from checked-in sources
        run: npm run render

      - name: Validate final MP4 using FFprobe and volumedetect
        run: npm run validate

      - name: Upload direct-source render and reports
        uses: actions/upload-artifact@v4
        with:
          name: arabic-abaya-production-${{ github.run_number }}
          path: |
            Arabic-Kinetic-Video-v2/out/final-video.mp4
            Arabic-Kinetic-Video-v2/out/render-validation.json
            Arabic-Kinetic-Video-v2/out/audio-mix-report.json
            Arabic-Kinetic-Video-v2/out/narration-report.json
            Arabic-Kinetic-Video-v2/public/audio/narration.wav
            Arabic-Kinetic-Video-v2/public/audio/narration-word-timings.json
            Arabic-Kinetic-Video-v2/public/audio/mixed_narration.wav
            Arabic-Kinetic-Video-v2/public/audio/sfx/*.wav
            Arabic-Kinetic-Video-v2/public/images/element-*.png
            Arabic-Kinetic-Video-v2/src/data/timeline.json
          if-no-files-found: error
          retention-days: 14
